name: Build & Release TrackerControl PC

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller TrackerControl.spec --noconfirm

      - name: Package Windows ZIP
        run: |
          Compress-Archive -Path dist\TrackerControl-PC.exe, start_trackercontrol.bat, README.md, LICENSE -DestinationPath dist\TrackerControl-PC-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackerControl-PC-Windows-x64
          path: dist/TrackerControl-PC-Windows-x64.zip

  build-linux:
    name: Build Linux Applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iptables dpkg

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Linux Binary
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Build Debian Package (.deb)
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh

      - name: Package Linux Tarball (.tar.gz)
        run: |
          python packaging/package_releases.py

      - name: Upload Linux Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackercontrol-linux-x86_64
          path: dist/trackercontrol-v*-linux-x86_64.tar.gz

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackercontrol-debian-package
          path: dist/linux/*.deb

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: TrackerControl-PC-Windows-x64
          path: release/

      - name: Download Linux Tarball
        uses: actions/download-artifact@v4
        with:
          name: trackercontrol-linux-x86_64
          path: release/

      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: trackercontrol-debian-package
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
