name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Compile Windows Executable
        run: |
          pyinstaller TrackerControl.spec --noconfirm

      - name: Package Windows ZIP
        run: |
          Compress-Archive -Path dist/TrackerControl-PC.exe, start_trackercontrol.bat, README.md, LICENSE -DestinationPath dist/TrackerControl-PC-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackerControl-PC-Windows-x64
          path: dist/TrackerControl-PC-Windows-x64.zip

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools iptables dpkg-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Compile Linux Binary
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Package Debian & Tarball
        run: |
          chmod +x packaging/package_linux_releases.sh
          ./packaging/package_linux_releases.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrackerControl-Linux-x86_64
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.tar.gz
            dist/linux/trackercontrol-linux

  build-macos:
    name: Build macOS Universal App & Packages
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Compile macOS Binary & App Bundle
        run: |
          chmod +x packaging/macos/build_macos.sh
          ./packaging/macos/build_macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrackerControl-macOS-Universal
          path: |
            dist/macos/*.tar.gz
            dist/macos/*.zip
            dist/macos/*.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/TrackerControl-PC-Windows-x64/*
            release-artifacts/TrackerControl-Linux-x86_64/*
            release-artifacts/TrackerControl-macOS-Universal/*
          draft: false
          prerelease: false
          generate_release_notes: true
