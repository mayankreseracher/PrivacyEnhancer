<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hex Shield Glow -->
  <path d="M256 32 L448 104 L448 248 C448 360 366 448 256 480 C146 448 64 360 64 248 L64 104 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="12" filter="url(#neonGlow)"/>

  <!-- Inner Dark Plate -->
  <path d="M256 48 L432 116 L432 248 C432 348 356 432 256 462 C156 432 80 348 80 248 L80 116 Z" 
        fill="url(#innerGrad)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="4"/>

  <!-- Cyber Grid Lines -->
  <path d="M120 200 L392 200 M120 280 L392 280 M256 120 L256 400" 
        stroke="rgba(0, 240, 255, 0.12)" stroke-width="2"/>

  <!-- Core Neon Privacy Emblem -->
  <path d="M256 140 L360 184 L360 260 C360 326 314 378 256 398 C198 378 152 326 152 260 L152 184 Z" 
        fill="none" stroke="url(#coreGrad)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Lock / Eye Target Center -->
  <circle cx="256" cy="256" r="36" fill="none" stroke="#00ff9d" stroke-width="8"/>
  <circle cx="256" cy="256" r="14" fill="#00ff9d"/>
  <path d="M256 196 L256 212 M256 300 L256 316 M196 256 L212 256 M300 256 L316 256" 
        stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
</svg>
