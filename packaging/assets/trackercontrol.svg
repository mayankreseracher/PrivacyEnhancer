<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0044ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Radar Grid Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <!-- Crosshairs -->
  <line x1="256" y1="50" x2="256" y2="462" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.15" />
  <line x1="50" y1="256" x2="462" y2="256" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Main Shield -->
  <path d="M 256 90 L 390 145 C 390 285 256 395 256 425 C 256 395 122 285 122 145 Z"
        fill="url(#shieldGrad)" fill-opacity="0.18"
        stroke="url(#shieldGrad)" stroke-width="10" filter="url(#glow)" />

  <!-- Shield Core Plate -->
  <path d="M 256 120 L 360 165 C 360 270 256 360 256 385 C 256 360 152 270 152 165 Z"
        fill="#090e17" stroke="#00ff9d" stroke-width="4" stroke-opacity="0.7" />

  <!-- Lock / Privacy Symbol in Center -->
  <rect x="216" y="240" width="80" height="65" rx="12" fill="#00ff9d" />
  <path d="M 230 240 L 230 205 C 230 185 282 185 282 205 L 282 240"
        fill="none" stroke="#00ff9d" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="268" r="8" fill="#090e17" />
  <rect x="253" y="268" width="6" height="18" rx="2" fill="#090e17" />

  <!-- Pulse Nodes -->
  <circle cx="340" cy="180" r="5" fill="#00ff9d" filter="url(#glow)" />
  <circle cx="170" cy="300" r="4" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="320" cy="310" r="4" fill="#ff0055" filter="url(#glow)" />
</svg>
